<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- THEME: swap ember for slate | paper | terminal | blueprint | frost | neon | sepia. -->
    <link rel="stylesheet" href="../themes/ember.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        position: relative;
        font-family: var(--font-display);
      }
      .glow { position: absolute; border-radius: 999px; filter: blur(160px); opacity: var(--glow-opacity); }
      .g1 { width: 760px; height: 760px; top: -320px; left: -160px; background: var(--glow1); }
      .g2 { width: 700px; height: 700px; bottom: -360px; right: -180px; background: var(--glow2); }
      .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
        background-size: 34px 34px;
        -webkit-mask-image: radial-gradient(ellipse 80% 75% at 45% 40%, #000 40%, transparent 100%);
      }
      .wrap { position: relative; height: 100%; padding: 100px 130px; display: flex; flex-direction: column; }
      .kicker {
        font: 500 22px var(--font-mono); color: var(--ink-faint);
        letter-spacing: 0.06em; text-transform: uppercase;
      }
      h1 {
        margin-top: 36px; font-size: 92px; line-height: 1.04; font-weight: 600;
        letter-spacing: -0.03em; max-width: 1450px;
      }
      h1 .accent { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .points { margin-top: 84px; display: grid; gap: 40px; max-width: 1300px; }
      .point { display: flex; gap: 28px; align-items: baseline; }
      .tick {
        flex: none; width: 30px; height: 30px; border-radius: 8px; translate: 0 4px;
        border: 2px solid var(--a1); position: relative;
      }
      .tick::after {
        content: ""; position: absolute; inset: 7px; border-radius: 3px; background: var(--a1);
      }
      .point b { font-size: 34px; font-weight: 600; }
      .point span { font-size: 34px; color: var(--ink-dim); }
      .footer {
        margin-top: auto; display: flex; justify-content: space-between; align-items: center;
        border-top: 1px solid var(--line); padding-top: 32px;
        font: 500 20px var(--font-mono); color: var(--ink-faint);
      }
      .footer .no { color: var(--a1); }
    </style>
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="dots"></div>

    <div class="wrap">
      <div class="kicker">Section · Talk title</div>

      <h1>A headline that makes<br />one <span class="accent">clear claim</span></h1>

      <div class="points">
        <div class="point">
          <div class="tick"></div>
          <div><b>First point.</b> <span>One sentence of support, no more — the slide is a prompt, not the talk.</span></div>
        </div>
        <div class="point">
          <div class="tick"></div>
          <div><b>Second point.</b> <span>Three points is the ceiling; two often lands harder.</span></div>
        </div>
        <div class="point">
          <div class="tick"></div>
          <div><b>Third point.</b> <span>If it needs a fourth, it is two slides.</span></div>
        </div>
      </div>

      <div class="footer">
        <span>project · speaker</span>
        <span class="no">04 / 12</span>
      </div>
    </div>
  </body>
</html>
