<!doctype html>

    <meta charset="utf-8" />
    <!-- THEME: swap ember for slate | paper | terminal | blueprint | frost | neon | sepia. If you copied this file out of
         the skill, copy the theme file beside it and use href="./ember.css". -->
    <link rel="stylesheet" href="../themes/ember.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1227px; height: 1183px; overflow: hidden;
        background: var(--ground);
        position: relative;
        font-family: var(--font-display);
      }
      /* The furniture is clipped by a container, not by the body.
         `overflow: hidden` on <body> holds for the screenshot but not for
         print-to-pdf: Chrome paginates on the overflow anyway, and a glow hanging
         240px below a tall canvas comes out as a second, blank sheet. */
      .furniture { position: absolute; inset: 0; overflow: hidden; }
      .glow { position: absolute; border-radius: 999px; filter: blur(120px); opacity: var(--glow-opacity); }
      .g1 { width: 560px; height: 560px; top: -260px; left: -160px; background: var(--glow1); }
      .g2 { width: 520px; height: 520px; bottom: -240px; right: -140px; background: var(--glow2); }
      .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
        background-size: 30px 30px;
        -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 45%, #000 45%, transparent 100%);
      }
      svg { position: relative; display: block; }

      /* ── type ─────────────────────────────────────────────────────────── */
      .kicker { font: 500 14px var(--font-mono); fill: var(--ink-faint); letter-spacing: 0.04em; }
      .title { font: 600 20px var(--font-display); fill: var(--ink); }
      .sub { font: 400 12.5px var(--font-mono); fill: var(--ink-dim); }
      .lbl { font: 500 12.5px var(--font-mono); }
      /* node text: display font, centred on the shape. Two sizes, because a
         wrapped label has to stay inside a box sized from the same metric the
         generator measured it with. */
      .nlbl { font: 600 15px var(--font-display); fill: var(--ink); }
      .glbl { font: 500 11.5px var(--font-mono); fill: var(--ink-faint); letter-spacing: 0.08em; }

      /* ── shapes ───────────────────────────────────────────────────────── */
      .node { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
      .s1 { stroke: var(--a1); } .s2 { stroke: var(--a2); } .s3 { stroke: var(--a3); } .s4 { stroke: var(--a4); }
      .f1 { fill: var(--a1); } .f2 { fill: var(--a2); } .f3 { fill: var(--a3); } .f4 { fill: var(--a4); }
      /* an accented node keeps the surface fill and spends the accent on its edge */
      .a1 { stroke: var(--a1); stroke-width: 1.6; } .a2 { stroke: var(--a2); stroke-width: 1.6; }
      .a3 { stroke: var(--a3); stroke-width: 1.6; } .a4 { stroke: var(--a4); stroke-width: 1.6; }

      /* ── edges ────────────────────────────────────────────────────────── */
      .edge { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .dotted { stroke-dasharray: 2 6; }
      .thick { stroke-width: 3.2; }
      /* the label sits ON the line, so it needs the ground painted under it */
      .chip { fill: var(--ground); }

      /* ── subgraph boundary ────────────────────────────────────────────── */
      .grouparea { fill: oklch(var(--ink-raw) / 4%); }
      .groupline { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 6; }

      /* element utilities — parts referenced from this page rely on these */
      .sline { stroke: var(--line); } .fline { fill: var(--line); }
      .sfaint { stroke: var(--ink-faint); } .ffaint { fill: var(--ink-faint); }
      .fground { fill: var(--ground); }
      .glyph { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
